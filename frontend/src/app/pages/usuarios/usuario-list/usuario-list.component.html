<div class="container mt-5">

  <div class="d-flex justify-content-between align-items-center mb-4">
    <h2 class="fw-bold">Usuarios</h2>
    <button class="btn btn-primary shadow-sm" (click)="nuevo()">
      + Nuevo usuario
    </button>
  </div>

  <div *ngIf="loading" class="text-center mt-4">
    <div class="spinner-border text-primary"></div>
  </div>

  <table class="table table-hover table-bordered align-middle shadow-sm" *ngIf="!loading">
    <thead class="table-light">
      <tr>
        <th>ID</th>
        <th>Nombre</th>
        <th>Apellido</th>
        <th>Correo</th>
        <th>Documento</th>
        <th>Estado</th>
        <th>Sexo</th>
        <th>Acciones</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let usuario of usuarios">
        <td>{{ usuario.id }}</td>
        <td>{{ usuario.nombre }}</td>
        <td>{{ usuario.apellido }}</td>
        <td>{{ usuario.correo }}</td>
        <td>{{ usuario.tipoDocumento }} - {{ usuario.documentoIdentificacion }}</td>
        <td>{{ usuario.estado }}</td>
        <td>{{ usuario.sexo }}</td>
        <td>
          <button class="btn btn-outline-warning btn-sm me-2" (click)="editar(usuario.id)">
            Editar
          </button>
          <button class="btn btn-outline-danger btn-sm" (click)="eliminar(usuario.id)">
            Eliminar
          </button>
        </td>
      </tr>

      <tr *ngIf="usuarios.length === 0">
        <td colspan="8" class="text-center text-muted">
          No hay usuarios registrados
        </td>
      </tr>
    </tbody>
  </table>

</div>

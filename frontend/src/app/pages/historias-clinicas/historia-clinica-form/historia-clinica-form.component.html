<div class="container mt-5">
  <div class="card shadow-sm">
    <div class="card-body">
      <h2 class="mb-4">{{ editMode ? 'Editar' : 'Nueva' }} Historia Clínica</h2>

      <form [formGroup]="form" (ngSubmit)="guardar()">

        <div class="mb-3">
          <label class="form-label">Fecha</label>
          <input type="date" class="form-control" formControlName="fechaCreacion">
          <div class="text-danger mt-1"
               *ngIf="form.get('fechaCreacion')?.touched && form.get('fechaCreacion')?.invalid">
            La fecha es obligatoria
          </div>
        </div>

        <div class="mb-3">
          <label class="form-label">Mascota</label>
          <select class="form-select" formControlName="mascotaId">
            <option value="">Seleccione</option>
            <option *ngFor="let m of mascotas" [value]="m.id">
              {{ m.nombre }}
            </option>
          </select>
          <div class="text-danger mt-1"
               *ngIf="form.get('mascotaId')?.touched && form.get('mascotaId')?.invalid">
            Debe seleccionar una mascota
          </div>
        </div>

        <button type="submit" class="btn btn-success me-2">Guardar</button>
        <button type="button" class="btn btn-secondary" (click)="volver()">Cancelar</button>

      </form>
    </div>
  </div>
</div>
